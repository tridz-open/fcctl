[project]
name = "fcctl"
dynamic = ["version"]
description = "Unofficial Python client and CLI for the Frappe Cloud dashboard (Central) and Pilot APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tridz Technologies" }]
keywords = ["frappe", "frappe-cloud", "erpnext", "cli", "devops", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
yaml = ["pyyaml"]
keyring = ["keyring"]
dev = ["pytest>=8", "respx", "pyyaml", "hypothesis", "unasync", "ruff", "keyring", "mypy", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/tridz-open/fcctl"
Issues = "https://github.com/tridz-open/fcctl/issues"
Changelog = "https://github.com/tridz-open/fcctl/blob/main/CHANGELOG.md"

[project.scripts]
fcctl = "fcctl.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "fcctl._version.__version__" }

[tool.setuptools.package-data]
fcctl = ["py.typed"]

[tool.setuptools.packages.find]
include = ["fcctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["fcctl/_sync"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741", "F811"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["fcctl"]

[[tool.mypy.overrides]]
module = ["fcctl.errors", "fcctl.policy", "fcctl.guard", "fcctl.request", "fcctl.ops", "fcctl.retry", "fcctl.redact"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["fcctl"]
omit = ["fcctl/_sync/*"]

[tool.coverage.report]
fail_under = 83
