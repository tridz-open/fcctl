  <path d="M808,695 L 364,695" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <path d="M358,745 C 398,747 398,779 364,779" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
