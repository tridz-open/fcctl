  <text x="32" y="729" font-size="11" fill="#64748b" text-anchor="start">alt</text>
  <text x="135" y="729" font-size="10" fill="#64748b" text-anchor="start">[Pilot answers 401]</text>
  <path d="M128,130 L 342,130" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M358,170 L 572,170" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
