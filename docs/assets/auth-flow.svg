  <text x="468" y="32" font-size="16" fill="#1e293b" text-anchor="middle">Auth flow: email code to Pilot JWT</text>
  <rect x="22" y="55" width="202" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="123" y="77.2" font-size="12" fill="#1e40af" text-anchor="middle">User</text>
  <rect x="252" y="55" width="202" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="353" y="77.2" font-size="12" fill="#b45309" text-anchor="middle">fcctl</text>
  <rect x="482" y="55" width="202" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="583" y="77.2" font-size="12" fill="#6b21a8" text-anchor="middle">Central API</text>
  <rect x="712" y="55" width="202" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="813" y="77.2" font-size="12" fill="#166534" text-anchor="middle">Pilot gateway</text>
  <text x="238" y="116" font-size="10" fill="#1e293b" text-anchor="middle">fcctl auth login</text>
  <text x="468" y="156" font-size="10" fill="#1e293b" text-anchor="middle">POST auth.send_code {email}</text>
  <text x="468" y="196" font-size="10" fill="#1e293b" text-anchor="middle">6-digit code by email</text>
  <text x="238" y="236" font-size="10" fill="#1e293b" text-anchor="middle">enter code (prompt/--code-stdin/IMAP)</text>
  <text x="468" y="276" font-size="10" fill="#1e293b" text-anchor="middle">POST auth.verify_code {email, code}</text>
  <text x="468" y="316" font-size="10" fill="#1e293b" text-anchor="middle">Set-Cookie sid, csrf_token</text>
  <text x="405" y="361" font-size="10" fill="#1e293b" text-anchor="start">SessionStore.set_central</text>
  <text x="405" y="373" font-size="10" fill="#1e293b" text-anchor="start">(Fernet, session.enc)</text>
  <text x="468" y="412" font-size="10" fill="#1e293b" text-anchor="middle">later Central calls send cookie sid</text>
  <text x="468" y="424" font-size="10" fill="#1e293b" text-anchor="middle">+ X-Frappe-CSRF-Token</text>
  <text x="238" y="456" font-size="10" fill="#1e293b" text-anchor="middle">any server or site command</text>
  <text x="468" y="496" font-size="10" fill="#1e293b" text-anchor="middle">GET sso.get_bench_link?server=ID</text>
  <text x="468" y="536" font-size="10" fill="#1e293b" text-anchor="middle">url = gateway/?sid=JWT</text>
  <text x="405" y="581" font-size="10" fill="#1e293b" text-anchor="start">split url: JWT + gateway</text>
  <text x="405" y="593" font-size="10" fill="#1e293b" text-anchor="start">memory cache, max_age 120 s</text>
  <text x="698" y="641" font-size="10" fill="#1e293b" text-anchor="middle">/api/v1/... Authorization: Bearer JWT</text>
  <text x="698" y="681" font-size="10" fill="#1e293b" text-anchor="middle">data</text>
  <text x="405" y="762" font-size="10" fill="#1e293b" text-anchor="start">invalidate cached JWT</text>
  <text x="468" y="806" font-size="10" fill="#1e293b" text-anchor="middle">get_bench_link again (single-flight)</text>
  <text x="698" y="846" font-size="10" fill="#1e293b" text-anchor="middle">retry with new JWT</text>
</svg>
